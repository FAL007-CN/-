<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
		<link rel="stylesheet" href="../css/first-1.css" />
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
		</script>
	</head>

	<body>
		<header class="mui-bar mui-bar-nav" style="background-color: dodgerblue;">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left" style="color: white;"></a>
			<h1 class="mui-title" style="color: white;">个人中心</h1>
		</header>



		<div class="user-cont">
			<div class="top">
				<img src="../images/小捷风.png" style="height: 120px; width: 120px; border-radius: 100%;" alt="" />
			</div>
			<div class="list" id="Mlist">
				<ul class="mui-table-view">
					<li class="mui-table-view-cell">
						<a class="all">
							1
						</a>
					</li>
					<li class="mui-table-view-cell">
						<a class="all">
							2
						</a>
					</li>
					<li class="mui-table-view-cell">
						<a class="all">
							3
						</a>
					</li>
				</ul>
			</div>
		</div>
		


	</body>
	</style>
	<script>
		
		var baseUrl = 'http://124.93.196.45:10091/prod-api';
		var userApi = '/getInfo';
		var token = localStorage.getItem('token');
		
		mui.ajax(baseUrl + userApi,{
			data:{
				
			},
			headers:{
				'Authorization': token
			},
			dataType:'json',//服务器返回json格式数据
			type:'get',//HTTP请求类型
			timeout:10000,//超时时间设置为10秒；
			success:function(data){
				console.log(data);
				
				var MlistHTML = '';
				
				MlistHTML += `
				
					<div class="list" id="Mlist">
						<ul class="mui-table-view">
							<li class="mui-table-view-cell">
								<a class="all">
									账号：${data.user.createBy}
								</a>
							</li>
							<li class="mui-table-view-cell">
								<a class="all">
									邮箱：${data.user.email}
								</a>
							</li>
							<li class="mui-table-view-cell">
								<a class="all">
									电话：${data.user.phonenumber}
								</a>
							</li>
						</ul>
					</div>
				
				`;
				
				document.getElementById("Mlist").innerHTML = MlistHTML;
				
			},
			error:function(xhr,type,errorThrown){
				
			}
		});
		
		
	</script>
</html>
