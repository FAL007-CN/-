<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
		<link rel="stylesheet" href="../css/first-1.css" />
		<script src="../js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
		</script>
	</head>

	<body>
		<header class="mui-bar mui-bar-nav" style="background-color: dodgerblue;">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left" style="color: white;"></a>
			<h1 class="mui-title" style="color: white;">物流详情</h1>
		</header>
		
		<div class="xiangqing-cont" id="mlist">
			<div class="top">
				<img src="../images/01.jpg" alt=""  style=""/>
			</div>
			<div class="center">
				公司简介
			</div>
			<div class="text">
				<span>111111111111</span>
			</div>
			<div class="bot">
				运输方式
			</div>
			<div class="box">
				<span>123</span>
			</div>
			<div class="bar">
				运费介绍
			</div>
			<div class="bats">
				省内约3-8￥/kg 
				省外约5-15￥/kg
			</div>
		</div>
	</body>
	</style>
	<script>
		var baseUrl = 'http://124.93.196.45:10091/prod-api/api';
		var wuliuUrl = '/logistics-inquiry/logistics_company/9';
		var imgApi = 'http://124.93.196.45:10091';
		var token =localStorage.getItem('token');
		console.log(token);
		
		mui.ajax(baseUrl + wuliuUrl,{
			data:{
				
			},
			headers:{
				'Authorization': token
			},
			dataType:'json',//服务器返回json格式数据
			type:'get',//HTTP请求类型
			timeout:10000,//超时时间设置为10秒；
			success:function(data){
				console.log(data);
				var mlistHTML = '';
				
				mlistHTML += `
				
					<div class="xiangqing-cont" id="mlist">
						<div class="top">
							<img src="${imgApi + data.data.imgUrl}" alt=""  style=""/>
						</div>
						<div class="center">
							公司简介
						</div>
						<div class="text">
							<span>${data.data.introduce}</span>
						</div>
						<div class="bot">
							运输方式
						</div>
						<div class="box">
							<span>${data.data.shippingMethod}</span>
						</div>
						<div class="bar">
							运费介绍
						</div>
						<div class="bats">
							省内约3-8￥/kg 
							省外约5-15￥/kg
						</div>
					</div>
				
				`;
				
				document.getElementById("mlist").innerHTML = mlistHTML;
				
			},
			error:function(xhr,type,errorThrown){
				
			}
		});
		
		
	</script>
</html>
