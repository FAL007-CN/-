<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="./js/mui.min.js"></script>
	<link rel="stylesheet" href="./css/index-1.css" />
    <link href="css/mui.min.css" rel="stylesheet"/>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
    </script>
</head>
<body>
	<header class="mui-bar mui-bar-nav" style="background-color: dodgerblue;">
		<h1 class="mui-title" style="color: white;">登录</h1>
	</header>
	<div class="cont">
		<div class="top">
			<div class="txt1">
				Digital Life
			</div>
			<div class="txt2">
				智慧生活
			</div>
		</div>
		
		<div class="center">
			<form class="mui-input-group">
				<div class="mui-input-row">
					<label>账号</label>
					<input type="text" class="mui-input-clear" placeholder="请输入账号" id="user">
				</div>
				<div class="mui-input-row">
					<label>密码</label>
					<input type="password" class="mui-input-password" placeholder="请输入密码" id="pwd">
				</div>
			</form>
		</div>
		<div class="bottom" id="buttons">
			<button type="button" id="btn" class="mui-btn mui-btn-blue mui-btn-block">确认登录</button>
		</div>
	</div>
	
	
	
	
	
	
</body>
<style>
	
</style>
<script>
	
	var baseUrl = 'http://124.93.196.45:10091/prod-api';
	var loginApi = '/api/login';
	
	document.getElementById("btn").addEventListener("tap",function(){
		
		var user = '';
		var pwd = '';
		
		user = document.getElementById("user").value;
		pwd = document.getElementById("pwd").value;
		console.log(user,pwd);
		
		if( user == ""){
			mui.alert('账号不能为空！')
			return;
		}
		if( pwd == ""){
			mui.alert('密码不能为空！')
			return;
		}
		
		mui.ajax(baseUrl + loginApi,{
			data:{
				"username":user,
				"password":pwd
			},
			dataType:'json',//服务器返回json格式数据
			type:'post',//HTTP请求类型
			contentType: 'application/json',
			timeout:10000,//超时时间设置为10秒；
			success:function(data){
				console.log(data);
				if(data.code == 200){
					
					localStorage.setItem('token', data.token); //全局存储token以供后续页面调用
					const token = localStorage.getItem('token');
					
					mui.alert('登录成功！')
					
					location.href ='./html/first.html'
				}
				
			},
			error:function(xhr,type,errorThrown){
				
			}
		});
			
	});
	
</script>
</html>
